<helmet>
<style>
  @font-face { font-family: "Gotham"; src: url("./fonts/Gotham-Light.ttf") format("truetype"); font-weight: 300; font-style: normal; font-display: block; }
  @font-face { font-family: "Gotham"; src: url("./fonts/Gotham-Book.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: "Gotham"; src: url("./fonts/Gotham-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: block; }
  @font-face { font-family: "Gotham"; src: url("./fonts/Gotham-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: "Gotham"; src: url("./fonts/Gotham-Black.ttf") format("truetype"); font-weight: 900; font-style: normal; font-display: block; }
  @font-face { font-family: "Gotham"; src: url("./fonts/Gotham-MediumItalic.ttf") format("truetype"); font-weight: 500; font-style: italic; font-display: block; }
  @font-face { font-family: "Gotham"; src: url("./fonts/Gotham-BookItalic.ttf") format("truetype"); font-weight: 400; font-style: italic; font-display: block; }
  doc-page:not(:defined) { visibility: hidden; }
  body { margin: 0; }
  doc-page { font-family: "Gotham", Arial, sans-serif; }
  a { color: #005FA1; text-decoration: none; }
  a:hover { color: #EC008C; }
</style>
<script src="./doc-page.js"></script>

<doc-page width="1190.55pt" height="841.89pt">

<section class="page" data-chair-page="" data-screen-label="04-05 Chair's Report" style="position:relative;width:1190.55pt;height:841.89pt;box-sizing:border-box;padding:0;margin:0;background:#F6F6F6;overflow:hidden">

  <sc-if value="{{ showDecoration }}" hint-placeholder-val="">
  </sc-if>

  <svg style="position:absolute;left:54.7pt;top:70pt;width:340.7pt;height:50pt" viewBox="0 0 340.7 50" role="img" aria-label="Chair&#8217;s Report"><text x="0" y="33.3" font-family="Gotham, Arial, sans-serif" font-size="37" font-weight="400" letter-spacing="-0.37"><tspan fill="#005FA1">C</tspan><tspan fill="#12589F">h</tspan><tspan fill="#24509E">a</tspan><tspan fill="#36499C">i</tspan><tspan fill="#49429B">r</tspan><tspan fill="#5B3A99">&#8217;</tspan><tspan fill="#6D3397">s</tspan><tspan fill="#7F2C96"> </tspan><tspan fill="#912594">R</tspan><tspan fill="#A31D93">e</tspan><tspan fill="#B61691">p</tspan><tspan fill="#C80F8F">o</tspan><tspan fill="#DA078E">r</tspan><tspan fill="#EC008C">t</tspan></text></svg>

  <image-slot id="chair-portrait" shape="circle" placeholder="Chair portrait" style="position:absolute;left:57pt;top:182.9pt;width:177.3pt;height:177.3pt"></image-slot>

  <div style="position:absolute;left:56.2pt;top:372.5pt;width:179.7pt;text-align:center;font-size:10pt;line-height:12pt;color:#6D6E71"><span style="font-weight:700">{{ signatory }}</span><br /><span style="font-weight:400">{{ signatoryRole }}</span></div>

  <div data-column="u" style="position:absolute;left:55.7pt;top:414pt;width:235.78pt;height:371pt;overflow:hidden;font-weight:400;font-size:9pt;line-height:12pt;letter-spacing:{{ trackU }};color:#6D6E71">
    <sc-for list="{{ colU }}" as="p" hint-placeholder-count="0">
      <div style="margin:0 0 {{ gapU }}">{{ p }}</div>
    </sc-for>
  </div>

  <div data-column="0" style="position:absolute;left:303.3pt;top:179.7pt;width:235.3pt;height:605.3pt;overflow:hidden;font-weight:400;font-size:9pt;line-height:12pt;letter-spacing:{{ track0 }};color:#6D6E71">
    <sc-for list="{{ col0 }}" as="p" hint-placeholder-count="9">
      <div style="margin:0 0 {{ gap0 }}">{{ p }}</div>
    </sc-for>
  </div>

  <div data-column="1" style="position:absolute;left:651.98pt;top:179.7pt;width:234.94pt;height:605.3pt;overflow:hidden;font-weight:400;font-size:9pt;line-height:12pt;letter-spacing:{{ track1 }};color:#6D6E71">
    <sc-for list="{{ col1 }}" as="p" hint-placeholder-count="9">
      <div style="margin:0 0 {{ gap1 }}">{{ p }}</div>
    </sc-for>
  </div>

  <div data-column="2" style="position:absolute;left:898.26pt;top:179.7pt;width:234.94pt;height:511pt;overflow:hidden;font-weight:400;font-size:9pt;line-height:12pt;letter-spacing:{{ track2 }};color:#6D6E71">
    <sc-for list="{{ col2 }}" as="p" hint-placeholder-count="8">
      <div style="margin:0 0 {{ gap2 }}">{{ p }}</div>
    </sc-for>
  </div>

  <image-slot id="chair-signature" shape="rect" fit="contain" placeholder="Signature" style="position:absolute;left:898.58pt;top:{{ sigTop }};width:55.5pt;height:49.1pt"></image-slot>
  <div style="position:absolute;left:899.28pt;top:{{ sigCaptionTop }};width:125.5pt;font-size:9pt;line-height:12pt;letter-spacing:-0.01em;color:#6D6E71"><span style="font-weight:700">{{ signatory }}</span><br /><span style="font-weight:400">{{ signatoryRole }}</span></div>

  <sc-if value="{{ overflowLabel }}" hint-placeholder-val="">
    <div style="position:absolute;left:303.3pt;top:700pt;width:829.9pt;background:#EC008C;color:#fff;padding:8pt 10pt;box-sizing:border-box">
      <div style="font-weight:700;font-size:9pt;line-height:12pt;letter-spacing:0.04em;text-transform:uppercase">{{ overflowLabel }}</div>
      <div style="font-weight:400;font-size:8pt;line-height:10.5pt;margin-top:5pt">{{ overflowText }}</div>
    </div>
  </sc-if>

  <div style="position:absolute;left:-3pt;top:821.6pt;width:1197.8pt;height:24.6pt;background:linear-gradient(90deg,#EC008C 0%,#005FA1 100%)"></div>

  <div style="position:absolute;left:55.68pt;top:798.85pt;width:16.5pt;font-weight:400;font-size:7pt;line-height:10.9pt;letter-spacing:0.04em;color:#005FA1">{{ folioLeft }}</div>
  <div style="position:absolute;left:74.14pt;top:798.85pt;width:220pt;font-size:6pt;line-height:10.9pt;letter-spacing:0.07em;color:#005FA1;white-space:nowrap"><span style="font-weight:400">RACING VICTORIA</span><span style="font-weight:700"> ANNUAL REPORT {{ footYear }}</span></div>

  <div style="position:absolute;left:963.22pt;top:798.85pt;width:154.8pt;font-size:6pt;line-height:10.9pt;letter-spacing:0.07em;color:#005FA1;white-space:nowrap"><span style="font-weight:400">RACING VICTORIA</span><span style="font-weight:700"> ANNUAL REPORT {{ footYear }}</span></div>
  <div style="position:absolute;left:1117.99pt;top:798.85pt;width:16.4pt;font-weight:400;font-size:7pt;line-height:10.9pt;letter-spacing:0.04em;color:#005FA1">{{ folioRight }}</div>

</section>

</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1588,&quot;height&quot;:1123},&quot;folioLeft&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:1,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Page&quot;},&quot;folioRight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Page&quot;}}">
// Column geometry from the FY25 InDesign frames (pt). The third column stops
// short of the others to clear the signature block below it.
// Test 4: columns 1-2 run to the same foot as the column under the portrait
// (785pt), so the feet line up; leftover depth goes into the paragraph gaps.
const COLS = [
  { width: 235.30, height: 605.3 },
  { width: 234.94, height: 605.3 },
  { width: 234.94, height: 511.0 },
];
// InDesign's paragraph composer fits roughly 4% more copy per column than the
// browser's greedy line breaker, so spec tracking alone overruns the spread.
// The FY25 designer solved the same problem by hand-tracking a paragraph to -20.
// Here the first value that fits wins, so fidelity degrades only as far as the
// copy demands.
const TRACKING = ['-0.02em', '-0.022em', '-0.024em', '-0.026em', '-0.028em', '-0.03em'];
// The FY25 designer hand-tracked individual paragraphs to hit specific column
// breaks. Same idea, per column: the middle column runs one notch tighter so it
// takes the two lines that otherwise start the third column, reproducing the
// printed break points. Offsets are steps into TRACKING, not absolute values,
// so they survive the escalation when copy grows.
const COL_OFFSET = [0, 4, 0];
// InDesign's 5.669 space-before + 2.835 space-after is carried entirely as
// space-after, so the first line of every column sits on its frame top.
// When the copy won't fit at FY25 spacing, the paragraph gap closes up (FY26:
// more, shorter paragraphs) before the tracking tightens further.
const GAPS = [8.504, 6, 4];
// Long copy (FY26) first opens a column under the portrait and its caption,
// as the CEO's Report does (FY25 CEO frame: 235.78 x 371 at 55.7, 414), and
// only then closes the paragraph gaps.
const UNDER = { width: 235.78, height: 371.0 };
// The signature sits under the last line of copy ("Yours sincerely,"), never
// lower than its FY25 place (692.9pt), with the name and role 6pt below it.
const COL_TOP = 179.7, SIG_GAP = 8, SIG_H = 49.1, SIG_MAX = 692.9;
const PLANS = [[false, 8.504], [true, 8.504], [true, 6], [true, 4]];

class Component extends DCLogic {
  state = { data: null, columns: [[], [], []], under: [], baseIdx: 0, gap: GAPS[0], leftover: [], sigTop: SIG_MAX, extra: {} };

  // Vertical justification: every column the copy runs on from closes on the
  // same last line as the fullest one; the difference is shared between that
  // column's paragraph gaps (max 6pt each).
  _justify(pass) {
    pass = pass || 0;
    const page = document.querySelector('section[data-chair-page]');
    if (!page) return;
    if (!pass) this._sentenceBreaks(page);
    const k = page.getBoundingClientRect().width / 1190.55;
    const keys = ['u', '0', '1', '2'];
    const lists = { u: this.state.under, 0: this.state.columns[0], 1: this.state.columns[1], 2: this.state.columns[2] };
    const used = keys.filter(c => (lists[c] || []).length);
    const runOn = used.slice(0, -1);
    const bottoms = {};
    runOn.forEach(c => {
      const el = page.querySelector('[data-column="' + c + '"]');
      if (!el) return;
      const r = document.createRange(); r.selectNodeContents(el);
      let b = 0; for (const q of r.getClientRects()) if (q.height > 0) b = Math.max(b, q.bottom);
      bottoms[c] = b;
    });
    const target = Math.max.apply(null, Object.values(bottoms).concat([0]));
    const extra = Object.assign({}, this.state.extra);
    let changed = false;
    runOn.forEach(c => {
      const n = (lists[c] || []).length - 1;
      if (n < 1 || !bottoms[c]) return;
      const d = (target - bottoms[c]) / k;
      if (Math.abs(d) < 0.2) return;
      extra[c] = Math.min(6, Math.max(0, (extra[c] || 0) + d / n));
      changed = true;
    });
    if (changed && pass < 6) this.setState({ extra }, () => setTimeout(() => this._justify(pass + 1), 60));
  }

  // SK, Full Draft V1: a line that wraps straight after a full stop reads as a
  // paragraph end. Such a paragraph's tracking is nudged (smallest change first,
  // up to 0.04em) until the break no longer falls on a full stop, provided it
  // gains no line; otherwise left as set.
  _sentenceBreaks(page) {
    const lineStarts = (el) => {
      const tn = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: n => n.data.trim() ? 1 : 3 }).nextNode(); if (!tn) return null;
      const s = tn.data, r = document.createRange(), out = [];
      let top = null; const re = /\S+/g; let m;
      while ((m = re.exec(s))) {
        r.setStart(tn, m.index); r.setEnd(tn, m.index + 1);
        const q = r.getClientRects()[0]; if (!q) continue;
        if (top === null || q.top > top + 2) { out.push(m.index); top = q.top; }
      }
      return { s, out };
    };
    const bad = (el) => { const L = lineStarts(el); if (!L) return false;
      return L.out.slice(1).some(i => /[.!?]["\u201D\u2019)]?$/.test(L.s.slice(0, i).trimEnd())); };
    page.querySelectorAll('[data-column] > div').forEach(el => {
      el.style.letterSpacing = '';
      if (!bad(el)) return;
      const base = parseFloat(getComputedStyle(el).letterSpacing) / parseFloat(getComputedStyle(el).fontSize) || 0;
      const lines0 = (lineStarts(el) || { out: [] }).out.length;
      // Smallest change first, tightening before loosening, up to 0.04em.
      for (let i = 1; i <= 40; i++) {
        const d = (i % 2 ? -1 : 1) * Math.ceil(i / 2) * 0.002;
        el.style.letterSpacing = (base + d).toFixed(4) + 'em';
        if (!bad(el) && (lineStarts(el) || { out: [] }).out.length <= lines0) return;
      }
      el.style.letterSpacing = '';
    });
  }

  // Tracking for one column: the fitted base, plus that column's own offset.
  trackFor(col, baseIdx) {
    return TRACKING[Math.min(baseIdx + COL_OFFSET[col], TRACKING.length - 1)];
  }

  componentDidMount() {
    const nudge = () => {
      const dp = document.querySelector('doc-page');
      if (dp && dp._measure) dp._measure();
    };
    nudge();
    requestAnimationFrame(nudge);

    // document.fonts.ready resolves before Gotham is even requested, so ask for
    // the face explicitly — otherwise measurement uses fallback metrics.
    Promise.all([
      (() => {
        const FY26 = window.RV_PREVIEW === true || /[?&]fy26\b/.test(location.search);
        const imp = () => FY26 ? import('./copy/fy26/chair-report.js') : import('./chair-report-data.js');
        return window.RVProduction ? window.RVProduction.load('chair-report-data', imp) : imp();
      })(),
      document.fonts.load('400 9pt "Gotham"').then(() => document.fonts.ready).catch(() => null),
    ])
      .then(([m]) => {
        const data = m.chairReport;
        let fitted = null, baseIdx = 0, gap = GAPS[0], under = false;
        outer: for (const [u, g] of PLANS) {
          gap = g; under = u;
          for (baseIdx = 0; baseIdx < TRACKING.length; baseIdx++) {
            fitted = this.flow(data.paragraphs, baseIdx, g, u);
            if (!fitted.leftover.length) break outer;
          }
        }
        baseIdx = Math.min(baseIdx, TRACKING.length - 1);
        if (fitted.leftover.length) {
          console.warn('Chair\u2019s Report: ' + fitted.leftover.length +
            ' paragraph(s) do not fit at maximum tracking \u2014 shown in the overflow bar.');
        } else {
          console.warn('Chair\u2019s Report: fitted at base tracking ' + TRACKING[baseIdx] +
            ' (step ' + (baseIdx + 1) + ' of ' + TRACKING.length + '), paragraph gap ' + gap + 'pt; columns set at ' +
            [0, 1, 2].map(c => this.trackFor(c, baseIdx)).join(' / ') +
            (baseIdx === TRACKING.length - 1 ? ' \u2014 NO HEADROOM LEFT: longer copy will overflow.' : '.'));
        }
        let sigTop = SIG_MAX;
        for (let c = fitted.used.length - 1; c >= 0; c--) {
          if (fitted.used[c] > 0) { sigTop = Math.min(SIG_MAX, COL_TOP + fitted.used[c] - gap + SIG_GAP); break; }
        }
        this.setState({ data, columns: fitted.columns, under: fitted.under, baseIdx, gap, leftover: fitted.leftover, sigTop, extra: {} },
          () => setTimeout(() => this._justify(0), 150));
      })
      .catch(e => console.error('chair-report-data.js failed to load', e));
  }

  _probe(widthPt, track) {
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;width:' +
      widthPt + 'pt;font-family:"Gotham",Arial,sans-serif;font-weight:400;font-size:9pt;' +
      'line-height:12pt;letter-spacing:' + track;
    document.body.appendChild(host);
    return host;
  }

  // Pour the paragraphs through the three columns, breaking mid-paragraph where
  // a column runs out — the same continuous flow InDesign does. Per-paragraph
  // packing wastes up to a paragraph per column, and this copy has no slack.
  flow(paragraphs, baseIdx, gap, withUnder) {
    const frames = (withUnder ? [UNDER] : []).concat(COLS);
    const out = frames.map(() => []);
    let queue = paragraphs.slice();
    const used = frames.map(() => 0);

    for (let f = 0; f < frames.length; f++) {
      const c = withUnder ? f - 1 : f;
      const columns = out, colIdx = f;
      const host = this._probe(frames[f].width, this.trackFor(Math.max(c, 0), baseIdx));
      const capPx = frames[f].height / 0.75;
      let usedPx = 0;

      while (queue.length) {
        const text = queue[0];
        host.textContent = text;
        const hPx = host.getBoundingClientRect().height + gap / 0.75;

        if (usedPx + hPx <= capPx) {
          columns[colIdx].push(text);
          queue.shift();
          usedPx += hPx;
          continue;
        }

        // Binary-search the last character that still fits this column.
        const availPx = capPx - usedPx;
        const node = host.firstChild;
        const len = node ? node.textContent.length : 0;
        const range = document.createRange();
        const top = host.getBoundingClientRect().top;
        let lo = 0, hi = len, best = 0;
        while (lo <= hi) {
          const mid = (lo + hi) >> 1;
          range.setStart(node, 0);
          range.setEnd(node, mid);
          const rects = range.getClientRects();
          const bottom = rects.length ? rects[rects.length - 1].bottom - top : 0;
          if (bottom <= availPx) { best = mid; lo = mid + 1; }
          else hi = mid - 1;
        }
        // Never break mid-word.
        let offset = best;
        if (offset > 0 && offset < len) {
          const space = text.lastIndexOf(' ', offset);
          offset = space > 0 ? space : 0;
        }
        if (offset > 0) {
          columns[colIdx].push(text.slice(0, offset).trimEnd());
          usedPx = capPx;
          const rest = text.slice(offset).trimStart();
          // A paragraph whose text fits but whose trailing space does not leaves
          // no remainder — drop it rather than carrying an empty block into the
          // next column, which would push that column's first line down a line.
          if (rest) queue[0] = rest;
          else queue.shift();
        }
        break;
      }
      used[f] = usedPx * 0.75;
      host.remove();
    }

    return withUnder ? { under: out[0], columns: out.slice(1), used: used.slice(1), leftover: queue } : { under: [], columns: out, used, leftover: queue };
  }

  renderVals() {
    const d = this.state.data;
    const meta = (d && d.meta) || {};
    const [col0, col1, col2] = this.state.columns;

    return {
      showDecoration: this.props.showDecoration ?? !(window.RV_PREVIEW === true || /[?&]fy26\b/.test(location.search)),
      signatory: meta.signatory || '',
      signatoryRole: meta.signatoryRole || '',
      footYear: this.props.year ? 2000 + +String(this.props.year).replace(/\D/g, '').slice(-2) : (meta.footYear || ''),
      folioLeft: this.props.folioLeft ?? meta.folioLeft ?? 4,
      folioRight: this.props.folioRight ?? meta.folioRight ?? 5,
      colU: this.state.under || [],
      trackU: this.trackFor(0, this.state.baseIdx),
      col0: col0 || [],
      col1: col1 || [],
      col2: col2 || [],
      gapPt: this.state.gap + 'pt',
      gapU: (this.state.gap + (this.state.extra.u || 0)).toFixed(3) + 'pt',
      gap0: (this.state.gap + (this.state.extra['0'] || 0)).toFixed(3) + 'pt',
      gap1: (this.state.gap + (this.state.extra['1'] || 0)).toFixed(3) + 'pt',
      gap2: (this.state.gap + (this.state.extra['2'] || 0)).toFixed(3) + 'pt',
      sigTop: this.state.sigTop.toFixed(1) + 'pt',
      sigCaptionTop: (this.state.sigTop + SIG_H + 6).toFixed(1) + 'pt',
      track0: this.trackFor(0, this.state.baseIdx),
      track1: this.trackFor(1, this.state.baseIdx),
      track2: this.trackFor(2, this.state.baseIdx),
      // Copy that will not fit is NEVER dropped silently — it surfaces in a
      // magenta bar across the foot of the spread, so an overrun is impossible
      // to miss in the preview or in a PDF proof.
      overflowLabel: this.state.leftover.length
        ? this.state.leftover.length + ' paragraph' + (this.state.leftover.length === 1 ? '' : 's') +
          ' will not fit this spread \u2014 trim the copy or extend the layout'
        : '',
      overflowText: this.state.leftover.join('  \u00b6  '),
    };
  }
}
</script>
</body>
