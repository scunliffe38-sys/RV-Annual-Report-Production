<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;595.276pt&quot;,&quot;height&quot;:&quot;841.89pt&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const clubs = [
      ["bm-crv", "Country Racing Victoria"],
      ["bm-mrc", "Melbourne Racing Club"],
      ["bm-mvrc", "Moonee Valley Racing Club"],
      ["bm-vrc", "Victoria Racing Club"],
      ["bm-cprc", "Cranbourne Pakenham Racing Club"],
    ];
    const bodies = [
      ["bm-ajra", "Australian Jumping Racing Association"],
      ["bm-asu", "Australian Services Union (Victorian Branch)"],
      ["bm-ata", "Australian Trainers Association"],
      ["bm-awu", "Australian Workers Union (Victoria)"],
      ["bm-meaa", "Media, Entertainment & Arts Alliance"],
      ["bm-tbv", "Thoroughbred Breeders Victoria"],
      ["bm-troa", "Thoroughbred Racehorse Owners Association"],
      ["bm-uwu", "United Workers Union"],
      ["bm-vba", "Victorian Bookmakers Association"],
      ["bm-vja", "Victorian Jockeys Association"],
    ];
    const pack = (rows) => rows.map(([id, name]) => ({ id, name }));
    return { clubs: pack(clubs), bodies: pack(bodies) };
  }
}
