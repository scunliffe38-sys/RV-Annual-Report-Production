<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1190.55pt&quot;,&quot;height&quot;:&quot;841.89pt&quot;}}">
class Component extends DCLogic {
  state = { fy26: null };
  // Per-character fills for FY25's gradient text (a url(#gradient) paint server prints
  // invisible). Each glyph takes the colour at its centre along the gradient span.
  _chars(text, font, startPt, spanPt, stops, weightOf) {
    const c = this._cv || (this._cv = document.createElement('canvas').getContext('2d'));
    c.font = font;
    const hex = t => {
      t = Math.max(0, Math.min(1, t));
      let i = 1; while (i < stops.length - 1 && stops[i][0] < t) i++;
      const [a, ca] = stops[i - 1], [b, cb] = stops[i], f = b === a ? 0 : (t - a) / (b - a);
      const p = s => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16));
      const A = p(ca), B = p(cb);
      return '#' + A.map((v, k) => Math.round(v + (B[k] - v) * f).toString(16).padStart(2, '0')).join('');
    };
    const px = parseFloat(font.match(/([\d.]+)pt/)[1]);
    let x = 0;
    return [...text].map((t, i) => {
      const w = c.measureText(t).width * 0.75;
      const mid = startPt + x + w / 2; x += w;
      return { t, c: hex(mid / spanPt), w: weightOf ? weightOf(i) : 400 };
    });
  }
  componentDidMount() {
    if (document.fonts) document.fonts.ready.then(() => this.forceUpdate());
    // The year's own page set-up (photo key names, which feature slot is wide,
    // preview photos) lives in copy/fyNN/awards.js. A production run loads it
    // for the run's year and lays the Word document's winners and captions over it.
    const run = window.RVProduction ? window.RVProduction.get('awards') : null;
    const preview = window.RV_PREVIEW === true || /[?&]fy26\b/.test(location.search);
    const yy = run && run.year ? String(run.year).slice(-2) : preview ? '26' : '';
    if (yy) import('./copy/fy' + yy + '/awards.js').then(m => this.setState({ fy26: m.copy })).catch(() => {});
  }
  renderVals() {
    const awardLines = [
      ["h", "2024-25 Victorian Racing Award Winners", "0"],
      ["i", "Scobie Breasley Medal \u2013 Blake Shinn"],
      ["i", "Victorian Racehorse of the Year \u2013 Via Sistina"],
      ["i", "Most Outstanding Training Performance \u2013 Matt Laurie"],
      ["i", "Tommy Corrigan Medal \u2013 Steven Pateman"],
      ["i", "Colin Alderson Rising Star Award \u2013 Gavin Bedggood"],
      ["i", "VJA Damien Oliver Most Valuable Jockey \u2013 Damian Lane"],
      ["i", "VJA Rising Star \u2013 Logan Bates"],
      ["i", "RV Acknowledged Retrainer of the Year \u2013 Jennifer Duffy"],
      ["i", "RV Acknowledged Retrainer of the Year Runner-Up \u2013 Louise Abey"],
      ["h", "2024-25 Premiership Winners", "14pt"],
      ["i", "Metropolitan Trainer \u2013 Ciaron Maher (113 wins)"],
      ["i", "Metropolitan Jockey \u2013 Blake Shinn (74 wins)"],
      ["i", "Metropolitan Apprentice \u2013 Tom Prebble (24 wins)"],
