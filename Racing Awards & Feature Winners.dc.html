    const captions = [
      "1. Queensland\u2019s Knight\u2019s Choice sealed a fairytale win in the Melbourne Cup",
      "2. Tom Kitten was the cat that got the cream in the All-Star Mile at Flemington",
      "3. Harry Coffey and Duke De Sessa were popular Caulfield Cup winners",

    return {
      awards: lines.map(([k, text, gapTop]) => ({ isHead: k === "h", isItem: k === "i", text, gapTop: gapTop || "0" })),
