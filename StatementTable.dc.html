<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <sc-for list="{{ table.rows }}" as="r" hint-placeholder-count="12">

    <sc-if value="{{ r.head1 }}" hint-placeholder-val="">
      <div style="display:grid;grid-template-columns:{{ r.gridCols }};align-items:end;min-height:17pt;padding:4.252pt 0;font-weight:700;font-size:8.5pt;line-height:11pt;background:{{ r.hbg }};color:{{ r.hfg }};border-bottom:{{ r.hrule }}">
        <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="4">
          <div style="text-align:right;padding-right:4.252pt">{{ c.t }}</div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ r.head2 }}" hint-placeholder-val="">
      <div style="display:grid;grid-template-columns:{{ r.gridCols }};align-items:end;min-height:14pt;padding:4.252pt 0;font-weight:700;font-size:7.5pt;line-height:10pt;letter-spacing:0.04em;text-transform:uppercase;background:{{ r.hbg }};color:{{ r.hfg }};border-bottom:{{ r.hrule }}">
        <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="4">
          <div style="text-align:right;padding-right:4.252pt">{{ c.t }}</div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ r.body }}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{ r.lineAbove }}" hint-placeholder-val="">
        <div style="height:0;border-top:0.5pt solid #005FA1"></div>
      </sc-if>
      <div style="display:grid;grid-template-columns:{{ r.gridCols }};align-items:center;min-height:15.7pt;font-size:9pt;line-height:12.027pt;letter-spacing:-0.005em;background:{{ r.bg }}">
        <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="4">
          <sc-if value="{{ c.left }}" hint-placeholder-val="{{ true }}">
            <div style="padding-left:{{ c.pl }};padding-right:4.252pt;font-weight:{{ c.w }};color:{{ c.c }}">{{ c.t }}</div>
          </sc-if>
          <sc-if value="{{ c.right }}" hint-placeholder-val="">
            <div style="text-align:right;padding-right:4.252pt;font-variant-numeric:tabular-nums;font-weight:{{ c.w }};color:{{ c.c }}">{{ c.t }}</div>
          </sc-if>
        </sc-for>
      </div>
      <sc-if value="{{ r.lineBelow }}" hint-placeholder-val="">
        <div style="height:0;border-top:0.5pt solid #005FA1"></div>
      </sc-if>
    </sc-if>

  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:660,&quot;height&quot;:520},&quot;table&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
