<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:794,&quot;height&quot;:1123},&quot;folioLeft&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:1,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Page&quot;},&quot;folioRight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;min&quot;:1,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Page&quot;}}">
// Geometry from the FY25 InDesign frames (pt).
const LEFT_W = 235.3, LEFT_H = 584.8;   // page 4, single column
const RIGHT_H = 585.7;                  // page 5, two columns (CSS handles the flow)
const SPACE_BEFORE = 5.669, SPACE_AFTER = 2.835;

class Component extends DCLogic {
  state = { data: null, cut: null };

  componentDidMount() {
    const nudge = () => {
      const dp = document.querySelector('doc-page');
      if (dp && dp._measure) dp._measure();
    };
    nudge();
    requestAnimationFrame(nudge);

    // document.fonts.ready resolves before Gotham is even requested, so ask for
    // the face explicitly — otherwise measurement uses fallback metrics.
    Promise.all([
      import('./chair-report-data.js'),
      document.fonts.load('400 9pt "Gotham"').then(() => document.fonts.ready).catch(() => null),
    ])
      .then(([m]) => {
        const data = m.chairReport;
        this.setState({ data, cut: this.findCut(data.paragraphs) }, () => this.checkFit());
      })
      .catch(e => console.error('chair-report-data.js failed to load', e));
  }

  // Where does page 4's column run out? Returns the paragraph index it breaks
  // in and the character offset within it, so the break can fall mid-paragraph
  // exactly as it does in InDesign. Per-paragraph packing would waste up to a
  // paragraph's worth of column and this copy has no slack to spare.
  findCut(paragraphs) {
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;width:' +
      LEFT_W + 'pt;font-family:"Gotham",Arial,sans-serif;font-weight:400;font-size:9pt;' +
      'line-height:12pt;letter-spacing:-0.01em';
    document.body.appendChild(host);

    const els = paragraphs.map(text => {
      const d = document.createElement('div');
      d.style.margin = SPACE_BEFORE + 'pt 0 ' + SPACE_AFTER + 'pt';
      d.textContent = text;
      host.appendChild(d);
      return d;
    });

    const top = host.getBoundingClientRect().top;
    const capPx = LEFT_H / 0.75;
    let cut = { index: paragraphs.length, offset: 0 };

    for (let i = 0; i < els.length; i++) {
      if (els[i].getBoundingClientRect().bottom - top <= capPx) continue;

      // Binary-search the last character that still fits inside the column.
      const node = els[i].firstChild;
      const len = node ? node.textContent.length : 0;
      const range = document.createRange();
      let lo = 0, hi = len, best = 0;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        range.setStart(node, 0);
        range.setEnd(node, mid);
        if (range.getBoundingClientRect().bottom - top <= capPx) { best = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
      // Never break mid-word.
      let offset = best;
      if (offset > 0 && offset < len) {
        const space = node.textContent.lastIndexOf(' ', offset);
        offset = space > 0 ? space : 0;
      }
      cut = { index: i, offset };
      break;
    }

    host.remove();
    return cut;
  }

  // Page 5's two columns are CSS columns, so overflow shows up as a third
  // column rather than clipped text. Report it instead of shipping it silently.
  checkFit() {
    const right = document.querySelector('[data-column="right"]');
    if (!right) return;
    const over = right.scrollWidth - right.clientWidth;
    if (over > 2) {
      console.warn('Chair\u2019s Report: copy overruns the spread by about ' +
        Math.round(over * 0.75 / 234.94 * 100) / 100 + ' of a column \u2014 trim the copy.');
    }
  }

  renderVals() {
    const d = this.state.data;
    const meta = (d && d.meta) || {};
    const paras = (d && d.paragraphs) || [];
    const cut = this.state.cut || { index: paras.length, offset: 0 };

    const breaking = paras[cut.index] || '';
    const head = cut.offset > 0 ? breaking.slice(0, cut.offset).trimEnd() : '';
    const tail = cut.offset > 0 ? breaking.slice(cut.offset).trimStart() : breaking;

    return {
      heading: meta.heading || '',
      signatory: meta.signatory || '',
      signatoryRole: meta.signatoryRole || '',
      footYear: meta.footYear || '',
      folioLeft: this.props.folioLeft ?? meta.folioLeft ?? 4,
      folioRight: this.props.folioRight ?? meta.folioRight ?? 5,
      colA: paras.slice(0, cut.index),
      headFragment: head,
      tailFragment: tail,
      colB: paras.slice(cut.index + 1),
    };
  }
}
</script>
